# Owner lane. Hand-written and specific to this repository, which is what every `ci.yml`
# across Archont561/* already is (doc-4 §4b). The CONSUMER lane — the release workflows this
# product renders into other repositories — is generated and must never be hand-edited
# (decision-3). Keeping the two apart is doc-3 §2.1.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# cancel-in-progress is true for ci and false for every release lane (doc-4 §6 rule 9).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Pixi environment
        uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          environments: default
          locked: true

      - name: Install coverage tool
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-tarpaulin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target

      # One command surface (decision-1): every step below is one `pixi run <task>`, plus the
      # coverage tool install and the upload action. They are listed separately so a red run names
      # the gate that failed in the job summary, without anyone needing to open the log.
      - name: Lint
        run: pixi run lint

      - name: Typecheck
        run: pixi run typecheck

      # Coverage runs the test suites with instrumentation, so tests are not run twice.
      - name: Test with coverage
        run: pixi run coverage

      # Strict on purpose: the criterion is that the upload succeeds, and a step that swallows
      # its own failure cannot show that. A public repository uploads tokenless; the token is
      # used only when the secret exists.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: target/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Lint workflows
        run: pixi run lint-actions

      - name: Workflow drift check
        run: pixi run workflow-check

      - name: Repository checks
        run: pixi run repo-check

      - name: Build
        run: pixi run build

  # Packaging had no proof until a release run, which is how the missing `c_stdlib` variant reached
  # a real release instead of a pull request (REL-27: the `build` job was the first thing ever to
  # render the recipe). The recipe now lives inside the crate it packages, so this job is also the
  # only place a move of that file can be shown correct. It runs beside `gates`, not after it, so a
  # pull request waits for the slower of the two rather than for their sum.
  package:
    name: package
    runs-on: ubuntu-latest
    # A cold `rattler-build` solve plus a release Cargo build; the release lane does the same work
    # in about a minute once the environment cache is warm.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same action pin as the gates job above: one workflow, one version of the tool that
      # materialises the environment both jobs build in.
      - name: Install Pixi environment
        uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          environments: default
          cache: true
          locked: true

      # One command surface (decision-1): the same `pixi run package` the release lane runs, so the
      # proof and the artifact cannot describe different recipes.
      - name: Build the conda artifact
        run: pixi run --frozen package

      # The filename is the packaging contract: `pixi-release-<version>-<build>.conda`. A recipe
      # that renders but names the package wrong fails here rather than at install time.
      - name: Assert the artifact names the package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(output/linux-64/pixi-release-*.conda)
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "::error::no pixi-release conda artifact was produced"
            find output -maxdepth 3 -type f || true
            exit 1
          fi
          printf '%s\n' "${artifacts[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
