name: draft-visibility-probe

# TEMPORARY. Delete after it has run once.
#
# Verifies open question #1 of .knowledge/proposals/2026-10-04-consumer-experience.md:
# can a job with `permissions: contents: read` list and download the assets of a DRAFT
# GitHub Release? The `prove` job in the proposed release-publish.yml assumes yes.
#
# Every step here is deliberately multi-line and non-fatal: the point is to collect exit
# codes and error text from both permission levels, not to pass.

on:
  push:
    branches: ["arena/**"]

permissions: {}

env:
  PROBE_TAG: v0.0.0-probe

jobs:
  seed:
    name: seed the draft with an asset (contents write)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Upload a probe asset to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "probe asset from run ${GITHUB_RUN_ID}" > probe-asset.txt
          gh release upload "$PROBE_TAG" --repo "$REPO" probe-asset.txt --clobber
          gh release view "$PROBE_TAG" --repo "$REPO" --json isDraft,assets \
            --jq '{isDraft, assets: [.assets[].name]}'

  read-only:
    name: SUBJECT — contents read
    needs: seed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Probe the draft with a read-only token
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          probe() {
            label="$1"; shift
            echo "----- $label"
            if out="$("$@" 2>&1)"; then
              echo "RESULT: ok"
            else
              echo "RESULT: FAILED exit=$?"
            fi
            echo "$out" | head -20
          }
          probe "gh release list"     gh release list --repo "$REPO" --limit 20
          probe "gh release view"     gh release view "$PROBE_TAG" --repo "$REPO"
          probe "gh release download" gh release download "$PROBE_TAG" --repo "$REPO" --dir dl
          probe "API get-by-tag"      gh api "repos/$REPO/releases/tags/$PROBE_TAG"
          probe "API list releases"   gh api "repos/$REPO/releases"
          echo "----- done (job intentionally green; read RESULT lines above)"

  read-write:
    name: CONTROL — contents write
    needs: seed
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Probe the draft with a write token
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          probe() {
            label="$1"; shift
            echo "----- $label"
            if out="$("$@" 2>&1)"; then
              echo "RESULT: ok"
            else
              echo "RESULT: FAILED exit=$?"
            fi
            echo "$out" | head -20
          }
          probe "gh release list"     gh release list --repo "$REPO" --limit 20
          probe "gh release view"     gh release view "$PROBE_TAG" --repo "$REPO"
          probe "gh release download" gh release download "$PROBE_TAG" --repo "$REPO" --dir dl
          probe "API get-by-tag"      gh api "repos/$REPO/releases/tags/$PROBE_TAG"
          probe "API list releases"   gh api "repos/$REPO/releases"
          echo "----- done (job intentionally green; read RESULT lines above)"
