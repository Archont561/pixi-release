name: draft-visibility-probe

# TEMPORARY. Delete after it has run.
#
# Verifies open question #1 of .knowledge/proposals/2026-10-04-consumer-experience.md:
# can a job with `permissions: contents: read` list, view and download the assets of a
# DRAFT GitHub Release? The proposed `prove` job assumes yes.
#
# Results are written back into the draft release body, because the sandbox running this
# investigation can reach api.github.com but not the Actions log or artifact blob hosts.

on:
  push:
    branches: ["arena/**"]

permissions: {}

env:
  PROBE_TAG: v0.0.0-probe

jobs:
  seed:
    name: seed the draft with an asset (contents write)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Upload a probe asset to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "probe asset from run ${GITHUB_RUN_ID}" > probe-asset.txt
          gh release upload "$PROBE_TAG" --repo "$REPO" probe-asset.txt --clobber
          gh release view "$PROBE_TAG" --repo "$REPO" --json isDraft,assets \
            --jq '{isDraft, assets: [.assets[].name]}'

  subject:
    name: SUBJECT — contents read
    needs: seed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      report: ${{ steps.p.outputs.report }}
    steps:
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          : > r.txt
          probe() {
            label="$1"; shift
            if out="$("$@" 2>&1)"; then
              printf '| %s | ok | %s |\n' "$label" "$(echo "$out" | head -1 | tr -d '|' | cut -c1-90)" >> r.txt
            else
              code=$?
              printf '| %s | **FAIL (%s)** | %s |\n' "$label" "$code" "$(echo "$out" | head -1 | tr -d '|' | cut -c1-90)" >> r.txt
            fi
          }
          probe "gh release list"            gh release list --repo "$REPO" --limit 20
          probe "gh release view <tag>"      gh release view "$PROBE_TAG" --repo "$REPO"
          probe "gh release download <tag>"  gh release download "$PROBE_TAG" --repo "$REPO" --dir dl
          probe "API GET releases/tags/<tag>" gh api "repos/$REPO/releases/tags/$PROBE_TAG"
          probe "API GET releases (list)"    gh api "repos/$REPO/releases"
          {
            echo "report<<PROBE_EOF"
            cat r.txt
            echo "PROBE_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "collected:"; cat r.txt

  control:
    name: CONTROL — contents write
    needs: seed
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      report: ${{ steps.p.outputs.report }}
    steps:
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          : > r.txt
          probe() {
            label="$1"; shift
            if out="$("$@" 2>&1)"; then
              printf '| %s | ok | %s |\n' "$label" "$(echo "$out" | head -1 | tr -d '|' | cut -c1-90)" >> r.txt
            else
              code=$?
              printf '| %s | **FAIL (%s)** | %s |\n' "$label" "$code" "$(echo "$out" | head -1 | tr -d '|' | cut -c1-90)" >> r.txt
            fi
          }
          probe "gh release list"            gh release list --repo "$REPO" --limit 20
          probe "gh release view <tag>"      gh release view "$PROBE_TAG" --repo "$REPO"
          probe "gh release download <tag>"  gh release download "$PROBE_TAG" --repo "$REPO" --dir dl
          probe "API GET releases/tags/<tag>" gh api "repos/$REPO/releases/tags/$PROBE_TAG"
          probe "API GET releases (list)"    gh api "repos/$REPO/releases"
          {
            echo "report<<PROBE_EOF"
            cat r.txt
            echo "PROBE_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "collected:"; cat r.txt

  report:
    name: write results into the draft body
    needs: [subject, control]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SUBJECT: ${{ needs.subject.outputs.report }}
          CONTROL: ${{ needs.control.outputs.report }}
        run: |
          set -euo pipefail
          {
            echo "## SUBJECT — permissions: contents: read"
            echo
            echo "| probe | result | first line |"
            echo "| --- | --- | --- |"
            echo "$SUBJECT"
            echo
            echo "## CONTROL — permissions: contents: write"
            echo
            echo "| probe | result | first line |"
            echo "| --- | --- | --- |"
            echo "$CONTROL"
          } > body.md
          gh api "repos/$REPO/releases/tags/$PROBE_TAG" --jq .id > id.txt || \
            gh release view "$PROBE_TAG" --repo "$REPO" --json databaseId --jq .databaseId > id.txt
          gh api --method PATCH "repos/$REPO/releases/$(cat id.txt)" -F body=@body.md --jq .html_url
          cat body.md
