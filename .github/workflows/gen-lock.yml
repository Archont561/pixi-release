# TEMPORARY — generates the real Cargo.lock on a runner, because crates.io is unreachable from
# the authoring sandbox. Deleted in the same pull request that consumes the lock.
name: gen-lock

on:
  push:
    branches: [arena/915986fa-pixi-release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          environments: default
          locked: true
      - name: Generate and commit Cargo.lock
        run: |
          set -euo pipefail
          cargo generate-lockfile
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already current; nothing to commit."
            exit 0
          fi
          git config user.name "pixi-release lock"
          git config user.email "lock@example.invalid"
          git commit -m "chore(deps): commit the resolved Cargo.lock (REL-21)"
          git push
