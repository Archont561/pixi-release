# Authored release policy. Reviewed as data; the tool never rewrites this file (decision-3).
# Canonical schema: backlog/docs/.../doc-3 §4.
#
# This repository is pixi-release's own first consumer, but NOT its own controller:
# v0.1.0 is cut by crates/xtask, and the owner lane migrates to a pinned prior
# release only once consumer-proof has proven it end to end (doc-3 §1.3).
schema = 1

[project]
version-source = "convco"          # convco stays authoritative (AGENTS.md)
tag-format     = "v{version}"
bot-identity   = "pixi-release[bot]"

# Every file whose version literal `prepare` owns. `cut` stages exactly this set and
# refuses any unaccounted modification — the replacement for the hand-maintained
# `git add` list in geoquery/qgis-rs (doc-3 §2.5).
[version]
manifests = [
  "Cargo.toml",
  "pixi.toml",
  "package.json",
  "apps/docs/package.json",
]
lockfiles = ["Cargo.lock", "bun.lock", "pixi.lock"]
changelog = "CHANGELOG.md"

# Verbs, never tools. How `pixi run gates` is implemented is this repository's business.
[gates]
required = ["gates"]

[workflows]
render = ["ci", "auto-release", "release"]
runner = "ubuntu-latest"

# pixi-release never compiles anything (decision-2). The matrix is policy data: the
# controller copies these values into the workflow and runs the task named here.
[build]
task        = "build-release-binary"
environment = "package"            # empty pixi env -> renders run-install: false

[[build.matrix]]
platform  = "linux-64"
runner    = "ubuntu-latest"
args      = "--target x86_64-unknown-linux-musl"
artifacts = ["target/x86_64-unknown-linux-musl/release/pixi-release"]

[[build.matrix]]
platform  = "linux-aarch64"
runner    = "ubuntu-24.04-arm"
args      = "--target aarch64-unknown-linux-musl"
artifacts = ["target/aarch64-unknown-linux-musl/release/pixi-release"]

[[build.matrix]]
platform  = "osx-64"
runner    = "macos-15-intel"
args      = "--target x86_64-apple-darwin"
artifacts = ["target/x86_64-apple-darwin/release/pixi-release"]

[[build.matrix]]
platform  = "osx-arm64"
runner    = "macos-15"
args      = "--target aarch64-apple-darwin"
artifacts = ["target/aarch64-apple-darwin/release/pixi-release"]

[[build.matrix]]
platform  = "win-64"
runner    = "windows-2025"
args      = "--target x86_64-pc-windows-msvc"
artifacts = ["target/x86_64-pc-windows-msvc/release/pixi-release.exe"]

[proof]
enabled              = true
isolated             = true        # env -i, scratch HOME, minimal PATH
smoke                = ["{asset} --version", "{asset} --help"]
expect-version       = true
deterministic-render = true        # this tool generates files, so render twice and compare

# A target is a registry, not a (registry, platform) pair (doc-2 §2.4).
# AGENTS.md gates the rest: no registry target until its artifact manifest and resume
# behaviour are specified and tested. Only github-release is admissible before REL-6.
[[target]]
name     = "github-release"
required = true
