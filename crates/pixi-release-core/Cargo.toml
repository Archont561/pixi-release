[package]
name = "pixi-release-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Release domain types and deterministic planning for pixi-release"
publish = false

[lints]
workspace = true

[dependencies]
# The authored policy is TOML (doc-3 §4). Parsing lives in core because it is deterministic
# domain behaviour with no I/O; serde is only the decoder for that document.
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
# A plan is canonical JSON (`doc-2` §2.3); serialisation is domain behaviour, not presentation.
serde_json = { workspace = true }
# The Git boundary is a pure trait plus its fake; `cut` validates through it, never a subprocess.
pixi-release-git.workspace = true
# Plan and policy digests are sha256 (`decision-3`, `decision-4`).
sha2.workspace = true

[dev-dependencies]
rstest.workspace = true
rstest-bdd.workspace = true
rstest-bdd-macros.workspace = true
proptest.workspace = true
