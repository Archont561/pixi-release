# The reviewed publish plan for this repository's own environment pack.
#
# The filename is load-bearing: the generated workflows pass `--config pixi-sandbox.toml`, so a
# leading dot leaves `plan` with no config, an empty matrix, and a publish job that never runs.
#
# `doc-3` §2.2 determines that `relock.yml` and `publish-sandbox.yml` are consumer-generated by
# `pixi-sandbox` and adopted as-is, and that this file is what they read. `decision-10` §3 keeps
# the two tools' ownership disjoint: pixi-sandbox owns these two files, pixi-release owns
# `release.yml` and `auto-release.yml`. Nothing here renders or edits a pixi-release workflow.
#
# The bundle packs the one reproducible development environment (`pixi.toml`, `[environments]`
# `default`) onto the orphan branch `sandbox/developer-linux-64`. Consumers restore it with
# `scripts/restore.sh` from that branch: a fresh clone gets rust, bun, convco, actionlint and
# lefthook at the pinned versions without solving conda.
schema = 1
branch_prefix = "sandbox"

# Keep the pack small: this environment runs tools, it does not compile a release from vendored
# crates. `decision-8` has every release rebuild from the tagged commit on its own runner.
cargo_vendor = false

[[bundle]]
name = "developer"
environments = ["default"]
platforms = ["linux-64"]

# Path filtering. Both lists are the canonical statement of when this pack repacks; the two
# generated workflows carry a generated mirror of them (decision-3: the workflow is a product of
# the policy, and drift between the two is what REL-12 gates).
#
# A repack costs about 400 MiB of branch history, so it must run only when a transport input
# actually changes: the sandbox config, pixi's manifest and lock, and the vendor manifests an
# environment may read. A docs, backlog or source-only change cannot alter the packed
# environment, so it must not repack.
[workflow]
push_paths = [
  "Cargo.lock",
  "Cargo.toml",
  "bun.lock",
  "package.json",
  "pixi-sandbox.toml",
  "pixi.lock",
  "pixi.toml",
]
# The relock guard is wider on purpose: a lockfile must still be caught when it is deleted or
# hand-edited, and `**/Cargo.toml` covers every workspace member. `.cargo/config.toml` is absent
# here, so it is not listed.
relock_paths = [
  "**/Cargo.toml",
  "Cargo.lock",
  "Cargo.toml",
  "bun.lock",
  "package.json",
  "pixi-sandbox.toml",
  "pixi.lock",
  "pixi.toml",
]
