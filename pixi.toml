# The one reproducible developer environment and task entrypoint.
[workspace]
name = "pixi-release"
version = "0.1.0"
description = "Safe release workflow controller for Pixi projects"
authors = ["Archont561 <142521648+Archont561@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Archont561/pixi-release"
repository = "https://github.com/Archont561/pixi-release"
channels = ["conda-forge"]
# Bun's conda-forge package is resolved for the Linux CI/developer environment. Native
# release artifacts will be built on their own runners rather than pretending this one
# development lockfile is a cross-platform compiler SDK.
platforms = ["linux-64"]
requires-pixi = ">=0.81.0"

[workspace.dependencies]
rust = ">=1.98.1,<1.99"
bun = ">=1.3.11,<1.4"
convco = ">=0.7.2,<0.8"
actionlint = ">=1.7.12,<1.8"
lefthook = ">=2.1.15,<2.2"

[feature.dev.dependencies]
rust = { workspace = true }
bun = { workspace = true }
convco = { workspace = true }
actionlint = { workspace = true }
lefthook = { workspace = true }

[environments]
default = { features = ["dev"], solve-group = "default" }

[tasks]
# Fresh-clone materialisation. Turbo is deliberately not invoked until the Bun lock is installed.
bun-install = { cmd = "bun install --frozen-lockfile", description = "Install the locked Bun workspace" }
hooks-install = { cmd = "lefthook install", depends-on = ["bun-install"], description = "Install Git hooks" }
setup = { depends-on = ["bun-install", "hooks-install"], description = "Materialise Bun dependencies and Git hooks" }

# Canonical cross-package entrypoints. Package-local work lives beside its package; these tasks
# route CI, hooks, and humans through the same Bun/Turbo graph.
build = { cmd = "bun run all:build", depends-on = ["bun-install"], description = "Turbo build across every workspace package" }
test = { cmd = "bun run all:test", depends-on = ["bun-install"], description = "Turbo test across every workspace package" }
coverage = { cmd = "bun run all:coverage", depends-on = ["bun-install"], description = "Turbo tests with Rust and TypeScript coverage reports" }
typecheck = { cmd = "bun run all:typecheck", depends-on = ["bun-install"], description = "Turbo type-check across every workspace package" }
lint = { cmd = "bun run all:lint", depends-on = ["bun-install"], description = "Turbo lint across every workspace package" }
fmt = { cmd = "bun run all:fmt", depends-on = ["bun-install"], description = "Turbo format across every workspace package" }

# Repository-global utilities do not belong to a Turbo package.
lint-commit = { cmd = "convco check --from-stdin", description = "Validate a conventional commit message" }
lint-actions = { cmd = "actionlint", description = "Lint GitHub Actions workflows" }
workflow-check = { cmd = "cargo run --manifest-path Cargo.toml -p pixi-release -- workflow check", description = "Check generated workflow scaffolding" }
# Owner-lane repository checks: required files, version agreement across manifests, and
# immutable action refs. Lives in xtask, not in the product (doc-3 §1.3).
repo-check = { cmd = "cargo run --manifest-path Cargo.toml -p xtask -- check", description = "Owner-lane repository checks" }
backlog = { cmd = "bun x backlog", depends-on = ["bun-install"], description = "Manage Backlog.md through its CLI" }

# Builds the conda artifact described by `recipe/recipe.yaml`. `convco` is a *run* dependency of
# that recipe (decision-6), so the artifact installs with the tool the controller executes.
package = { cmd = "pixi exec -c conda-forge --spec 'rattler-build>=0.77,<0.78' rattler-build build --recipe recipe/recipe.yaml --output-dir output -c conda-forge", description = "Build the pixi-release conda artifact into output/" }

# Registry delivery for the release lane (decision-14). prefix.dev trusted publishing exchanges
# the workflow's GitHub OIDC token for a channel-scoped credential, so no token is stored here.
publish-conda = { cmd = "pixi upload prefix --channel 'archont561/archont561' --generate-attestation --skip-existing output/linux-64/*.conda", description = "Upload the built conda artifact to the project channel" }

# This is the local equivalent of the CI quality gate. Build remains a separate artifact gate.
gates = { depends-on = ["lint", "typecheck", "test", "lint-actions", "workflow-check", "repo-check"], description = "Every required pre-merge check" }
ci = { depends-on = ["gates", "build"], description = "Gates plus all workspace builds" }
